<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>

    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="logo-emblem" filter="url(#softShadow)" transform="translate(256, 249)">
    <!-- 1. Rounded Hexagon Tech Badge (Hardware / MCU Symbol) -->
    <path d="M 0,-218 
             L 188,-110 
             A 26,26 0 0,1 201,-87 
             L 201,87 
             A 26,26 0 0,1 188,110 
             L 0,218 
             A 26,26 0 0,1 -26,218 
             L -188,110 
             A 26,26 0 0,1 -201,87 
             L -201,-87 
             A 26,26 0 0,1 -188,-110 
             L -26,-218 
             A 26,26 0 0,1 0,-218 Z" 
          fill="url(#badgeGrad)" stroke="#334155" stroke-width="5"/>

    <!-- 2. Left Bridge Wave (Cyan: Host PC / idecobot link @ 115.2k) -->
    <path d="M -75,-140 A 158,158 0 0,0 -75,140" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="22" stroke-linecap="round"/>

    <!-- Left Data Node -->
    <circle cx="-158" cy="0" r="13" fill="#00F5D4"/>
    <circle cx="-158" cy="0" r="5" fill="#FFFFFF"/>

    <!-- 3. Right Bridge Wave (Orange: Robot Arm / MyCobot servos @ 1.0M) -->
    <path d="M 75,-140 A 158,158 0 0,1 75,140" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="22" stroke-linecap="round"/>

    <!-- Right Data Node -->
    <circle cx="158" cy="0" r="13" fill="#FFB703"/>
    <circle cx="158" cy="0" r="5" fill="#FFFFFF"/>

    <!-- 4. Bold Minimalist "T" (Transponder Core) -->
    <!-- Top Horizontal Crossbar -->
    <path d="M -96,-65 
             L 96,-65 
             A 18,18 0 0,1 114,-47 
             L 114,-37 
             A 18,18 0 0,1 96,-19 
             L -96,-19 
             A 18,18 0 0,1 -114,-37 
             L -114,-47 
             A 18,18 0 0,1 -96,-65 Z" 
          fill="url(#tGrad)"/>

    <!-- Vertical Stem of T -->
    <path d="M -23,-37 
             L 23,-37 
             L 23,90 
             A 23,23 0 0,1 -23,90 Z" 
          fill="url(#tGrad)"/>

    <!-- Left Wing Accent (Cyan Pulse) -->
    <path d="M -96,-65 L -45,-65 L -45,-19 L -96,-19 A 18,18 0 0,1 -114,-37 L -114,-47 A 18,18 0 0,1 -96,-65 Z" 
          fill="url(#cyanGrad)"/>

    <!-- Right Wing Accent (Orange Pulse) -->
    <path d="M 45,-65 L 96,-65 A 18,18 0 0,1 114,-47 L 114,-37 A 18,18 0 0,1 96,-19 L 45,-19 Z" 
          fill="url(#orangeGrad)"/>

    <!-- 5. Central Transceiver Core Beacon -->
    <circle cx="0" cy="-42" r="26" fill="#0A0E17" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-42" r="14" fill="url(#cyanGrad)"/>
    <circle cx="0" cy="-42" r="6" fill="#FFFFFF"/>
  </g>
</svg>
